ekf_filter_node:
  ros__parameters:

    frequency: 50
    two_d_mode: true

    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /imu/data
    imu0_frame: imu_link
    imu0_remove_gravitational_acceleration: true

    imu0_config: [false, false, false,  # x y z position
                  true, true, true,    # roll pitch yaw
                  false, false, true,  # vel x vel y vel z
                  false, false, false] # acc x y z

    imu0_differential: false
    imu0_relative: false

    imu0_queue_size: 10
